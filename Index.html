<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060208">
<title>Love Heart</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#060208}
body{display:flex;align-items:center;justify-content:center}
#stage{width:min(100vw,100svh);height:min(100vw,100svh);flex:none}
canvas{display:block;width:100%;height:100%}
</style>
</head>
<body><div id="stage"><canvas id="love"></canvas></div>
<script>
(()=>{"use strict";
const BG="#060208",FONT="Arial",DURATION=10,ANIM=42,TICK=16,GAP=7,LIFT=34,SIZES=[9,10,11,12];
const PHRASES=["I love you","Seni seviyorum","Te amo","Je t'aime","Ich liebe dich","Ti amo","Eu te amo","Я тебя люблю","사랑해","愛してる","我爱你","मैं तुमसे प्यार करता हूँ","Σ' αγαπώ","Ik hou van jou","Jag älskar dig","Kocham cię","ฉันรักเธอ","Anh yêu em","Aku cinta kamu","Я тебе кохаю"];
const canvas=document.getElementById("love"),ctx=canvas.getContext("2d");
let seed=11,active=[],finished=[],order=[],nextIndex=0,start=0,last=0,complete=false,shimmerAt=0,shimmerItem=null,shimmerOn=false;
const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296},pick=a=>a[Math.floor(rand()*a.length)],clamp=v=>Math.max(0,Math.min(1,v));
const mix=(a,b,k)=>a.map((v,i)=>v+(b[i]-v)*k),dim=(c,k)=>c.map(v=>v*k),hex=c=>"#"+c.map(v=>Math.round(clamp(v)*255).toString(16).padStart(2,"0")).join("");
const BGC=[6/255,2/255,8/255],FLASH=[1,.78,.78];
function fitStage(){const side=Math.min(window.innerWidth,window.innerHeight);const stage=document.getElementById("stage");stage.style.width=side+"px";stage.style.height=side+"px";const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=800*dpr;canvas.height=800*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw();}
function heart(a){return [16*Math.pow(Math.sin(a),3)*21,(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a))*21+20]}
const poly=Array.from({length:720},(_,i)=>heart(2*Math.PI*i/720)),edges=poly.map((p,i)=>[p,poly[(i+1)%poly.length]]),ymax=Math.max(...poly.map(p=>p[1])),ymin=Math.min(...poly.map(p=>p[1])),cy=(ymax+ymin)/2;
function spans(y){const xs=[];for(const [[x1,y1],[x2,y2]] of edges){if((y1<=y&&y<y2)||(y2<=y&&y<y1))xs.push(x1+(y-y1)*(x2-x1)/(y2-y1))}xs.sort((a,b)=>a-b);const out=[];for(let i=0;i+1<xs.length;i+=2)out.push([xs[i],xs[i+1]]);return out}
function intersect(A,B){const out=[];for(const a of A)for(const b of B){const lo=Math.max(a[0],b[0]),hi=Math.min(a[1],b[1]);if(hi-lo>14)out.push([lo,hi])}return out}
function* phraseCycle(){while(true){const a=PHRASES.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}yield* a}}
function build(){const cycle=phraseCycle(),placed=[],rowH=15,half=11;
for(let y=ymax-half;y>ymin+half;y-=rowH){for(const [sx,ex] of intersect(spans(y+half),spans(y-half))){const lo=sx+4,hi=ex-4;let cur=lo+rand()*8;const line=[];
while(true){let fit=null;for(let n=0;n<10;n++){const text=cycle.next().value,size=pick(SIZES);ctx.font=`bold ${size}px ${FONT}`;const width=ctx.measureText(text).width;if(cur+width<=hi){fit={text,size,width};break}}if(!fit)break;line.push({x:cur+fit.width/2,text:fit.text,size:fit.size,width:fit.width});cur+=fit.width+GAP}
if(!line.length)continue;if(line.length>1){const left=hi-(line[line.length-1].x+line[line.length-1].width/2);line.forEach((p,i)=>p.x+=left*i/(line.length-1))}else line[0].x=(lo+hi)/2;
line.forEach((p,i)=>placed.push({x:p.x,y,text:p.text,size:p.size,edge:i===0||i===line.length-1}))}}
const wine=[.58,0,.09],crimson=[.90,.05,.14],blood=[.98,.10,.16];
for(const p of placed){p.rad=Math.min(1,Math.hypot(p.x/(16*21),(p.y-cy)/(14.5*21)));let c=mix(wine,crimson,.25+.75*p.rad);c=mix(c,blood,rand()*.35+(p.edge?.3:0));p.color=c.map(v=>Math.min(1,v))}
const outline=placed.filter(p=>p.edge),inside=placed.filter(p=>!p.edge);outline.sort((a,b)=>Math.atan2(a.x,a.y-cy)-Math.atan2(b.x,b.y-cy));inside.sort((a,b)=>a.rad-b.rad);return outline.concat(inside)}
function text(p,x,y,color,off=0){ctx.font=`bold ${p.size+off}px ${FONT}`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillStyle=color;ctx.fillText(p.text,x,y)}
function draw(){ctx.clearRect(0,0,800,800);ctx.fillStyle=BG;ctx.fillRect(0,0,800,800);
for(const p of finished){text(p,p.x+2,-p.y+3,BG);ctx.save();ctx.shadowColor=hex(dim(p.color,.45));ctx.shadowBlur=5;text(p,p.x,-p.y,hex(p.color));ctx.restore()}
for(const p of active){const u=clamp(p.frame/ANIM),e=1-Math.pow(1-u,3),x=p.x+p.dx*(1-e),y=-p.y-(1-e)*LIFT;text(p,x+2,y+3,hex(mix(BGC,dim(p.color,.30),e)));ctx.save();ctx.shadowColor=hex(mix(BGC,dim(p.color,.65),e*e));ctx.shadowBlur=7*e;text(p,x,y,hex(mix(BGC,dim(p.color,.20),e*e)),1);ctx.restore();const flash=.75*Math.sin(Math.PI*clamp((u-.55)/.45)),col=mix(mix(BGC,p.color,Math.pow(e,1.5)),FLASH,flash);ctx.save();ctx.shadowColor=hex(dim(col,.7));ctx.shadowBlur=4*e;text(p,x,y,hex(col));ctx.restore()}
if(shimmerItem)text(shimmerItem,shimmerItem.x,-shimmerItem.y,hex(shimmerOn?mix(shimmerItem.color,FLASH,.6):shimmerItem.color))}
function reset(){seed=11;order=build();nextIndex=0;active=[];finished=[];complete=false;start=performance.now();last=start;shimmerAt=start;requestAnimationFrame(frame)}
function frame(now){const dt=Math.min(50,now-last);last=now;if(!complete){const elapsed=now-start,desired=Math.min(order.length,Math.floor(elapsed/(DURATION*1000)*order.length));while(nextIndex<desired){const p=order[nextIndex++];p.frame=0;p.dx=rand()*20-10;active.push(p)}active.forEach(p=>p.frame+=dt/TICK);const keep=[];for(const p of active){if(p.frame>=ANIM)finished.push(p);else keep.push(p)}active=keep;if(elapsed>=DURATION*1000&&nextIndex<order.length){while(nextIndex<order.length){const p=order[nextIndex++];p.frame=0;p.dx=rand()*20-10;active.push(p)}}if(nextIndex>=order.length&&active.length===0){complete=true;shimmerAt=now}}else if(now-shimmerAt>=140){shimmerAt=now;if(finished.length){shimmerItem=pick(finished);shimmerOn=true;setTimeout(()=>{shimmerOn=false;draw()},260)}}draw();requestAnimationFrame(frame)}
window.addEventListener("resize",fitStage);fitStage();reset();
})();
</script></body></html>
