<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#060208">
<title>Love Heart</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #060208;
    overflow: hidden;
  }
  body {
    display: grid;
    place-items: center;
    min-height: 100svh;
  }
  canvas {
    display: block;
    width: min(100vw, 100svh);
    height: min(100vw, 100svh);
    max-width: 100vw;
    max-height: 100svh;
    background: #060208;
  }
</style>
</head>
<body>
<canvas id="love" aria-label="An animated heart made of I love you in different languages"></canvas>
<script>
(() => {
  "use strict";

  // Values adapted from the original Python animation.
  const SC = 21;
  const OY = 20;
  const DURATION = 10;     // seconds to form the heart
  const TICK = 16;         // approximate 60 FPS
  const ANIM = 42;         // frames for each phrase to appear
  const LIFT = 34;
  const GAP = 7;
  const SIZES = [9, 10, 11, 12];
  const FONT = "Arial";
  const BG = "#060208";
  const FLASH = [1.0, 0.78, 0.78];

  const PHRASES = [
    "I love you", "Seni seviyorum", "Te amo", "Je t'aime",
    "Ich liebe dich", "Ti amo", "Eu te amo", "Я тебя люблю",
    "사랑해", "愛してる", "我爱你", "मैं तुमसे प्यार करता हूँ",
    "Σ' αγαπώ", "Ik hou van jou", "Jag älskar dig", "Kocham cię",
    "ฉันรักเธอ", "Anh yêu em", "Aku cinta kamu", "Я тебе кохаю"
  ];

  const canvas = document.getElementById("love");
  const ctx = canvas.getContext("2d");
  let W = 800, H = 800, scale = 1, dpr = 1;
  let seed = 11;
  const rand = () => {
    seed = (seed * 1664525 + 1013904223) >>> 0;
    return seed / 4294967296;
  };
  const choice = a => a[Math.floor(rand() * a.length)];
  const clamp = v => Math.max(0, Math.min(1, v));
  const mix = (a, b, k) => a.map((v, i) => v + (b[i] - v) * k);
  const dim = (c, k) => c.map(v => v * k);
  const hex = c => "#" + c.map(v => Math.round(clamp(v) * 255).toString(16).padStart(2, "0")).join("");
  const BGC = [6/255, 2/255, 8/255];

  function resize() {
    const side = Math.min(window.innerWidth, window.innerHeight);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.style.width = side + "px";
    canvas.style.height = side + "px";
    canvas.width = Math.round(side * dpr);
    canvas.height = Math.round(side * dpr);
    W = H = 800;
    scale = side / 800;
    ctx.setTransform(dpr * scale, 0, 0, dpr * scale, 0, 0);
    draw();
  }

  function heart(a) {
    const x = 16 * Math.pow(Math.sin(a), 3);
    const y = 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a);
    return [x * SC, y * SC + OY];
  }
  const POLY = Array.from({length:720}, (_, i) => heart(2 * Math.PI * i / 720));
  const EDGES = POLY.map((p, i) => [p, POLY[(i + 1) % POLY.length]]);
  const YMAX = Math.max(...POLY.map(p => p[1]));
  const YMIN = Math.min(...POLY.map(p => p[1]));
  const CY = (YMAX + YMIN) / 2;

  function spans(y) {
    const xs = [];
    for (const [[x1,y1],[x2,y2]] of EDGES) {
      if ((y1 <= y && y < y2) || (y2 <= y && y < y1)) {
        xs.push(x1 + (y-y1) * (x2-x1) / (y2-y1));
      }
    }
    xs.sort((a,b) => a-b);
    const result = [];
    for (let i=0; i+1<xs.length; i+=2) result.push([xs[i], xs[i+1]]);
    return result;
  }
  function intersect(A, B) {
    const out = [];
    for (const a of A) for (const b of B) {
      const lo = Math.max(a[0], b[0]), hi = Math.min(a[1], b[1]);
      if (hi - lo > 14) out.push([lo, hi]);
    }
    return out;
  }
  function dist(x,y) {
    return Math.hypot(x/(16*SC), (y-CY)/(14.5*SC));
  }
  function* phraseCycle() {
    while (true) {
      const order = PHRASES.slice();
      for (let i=order.length-1; i>0; i--) {
        const j = Math.floor(rand() * (i+1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      for (const phrase of order) yield phrase;
    }
  }

  function build() {
    const cycle = phraseCycle();
    const placed = [];
    let y = YMAX - 11;
    while (y > YMIN + 11) {
      const row = intersect(spans(y + 11), spans(y - 11));
      for (const [start, end] of row) {
        const lo = start + 4, hi = end - 4;
        let cur = lo + rand() * 8;
        const line = [];
        while (true) {
          let fit = null;
          for (let tries=0; tries<10; tries++) {
            const text = cycle.next().value;
            const size = choice(SIZES);
            ctx.font = `bold ${size}px ${FONT}`;
            const width = ctx.measureText(text).width;
            if (cur + width <= hi) { fit = {text, size, width}; break; }
          }
          if (!fit) break;
          line.push({x: cur + fit.width/2, text: fit.text, size: fit.size, width: fit.width});
          cur += fit.width + GAP;
        }
        if (!line.length) continue;
        if (line.length > 1) {
          const left = hi - (line[line.length-1].x + line[line.length-1].width/2);
          line.forEach((item, i) => item.x += left * i/(line.length-1));
        } else {
          line[0].x = (lo + hi)/2;
        }
        line.forEach((item, i) => placed.push({
          x:item.x, y, text:item.text, size:item.size,
          edge:i===0 || i===line.length-1
        }));
      }
      y -= 15;
    }

    const wine = [0.58, 0, 0.09], crimson = [0.90, 0.05, 0.14], blood = [0.98, 0.10, 0.16];
    for (const p of placed) {
      const rad = Math.min(1, dist(p.x,p.y));
      let base = mix(wine, crimson, 0.25 + 0.75*rad);
      base = mix(base, blood, rand()*0.35 + (p.edge ? 0.3 : 0));
      p.color = base.map(v => Math.min(1,v));
      p.rad = rad;
    }
    const edges = placed.filter(p=>p.edge);
    const inner = placed.filter(p=>!p.edge);
    edges.sort((a,b) => (Math.atan2(a.x,a.y-CY)%(2*Math.PI)) - (Math.atan2(b.x,b.y-CY)%(2*Math.PI)));
    inner.sort((a,b) => (-a.rad + rand()*0.08) - (-b.rad + rand()*0.08));
    return edges.concat(inner);
  }

  let ORDER = [];
  let nextIndex = 0;
  let active = [];
  let finished = [];
  let startTime = 0;
  let lastTime = 0;
  let shimmerTime = 0;
  let shimmer = [];
  let complete = false;

  function drawText(p, x, y, color, sizeOffset=0) {
    ctx.font = `bold ${p.size + sizeOffset}px ${FONT}`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = color;
    ctx.fillText(p.text, x, y);
  }

  function draw() {
    ctx.clearRect(0,0,800,800);
    ctx.fillStyle = BG;
    ctx.fillRect(0,0,800,800);

    for (const p of finished) {
      const x = p.x, y = -p.y;
      drawText(p, x+2, y+3, BG);
      ctx.save();
      ctx.shadowColor = hex(dim(p.color, 0.45));
      ctx.shadowBlur = 5;
      drawText(p, x, y, hex(p.color));
      ctx.restore();
    }

    for (const p of active) {
      const u = clamp(p.frame / ANIM);
      const e = 1 - Math.pow(1-u,3);
      const x = p.x, y = -p.y;
      const hover = (1-e)*LIFT;
      const px = x + p.dx*(1-e);
      const py = y-hover;
      drawText(p, px+2, py+3, hex(mix(BGC, dim(p.color,0.30),e)));
      ctx.save();
      ctx.shadowColor = hex(mix(BGC, dim(p.color,0.65),e*e));
      ctx.shadowBlur = 7*e;
      drawText(p, px, py, hex(mix(BGC, dim(p.color,0.20),e*e)), 1);
      ctx.restore();
      const flash = 0.75 * Math.sin(Math.PI * clamp((u-0.55)/0.45));
      const col = mix(mix(BGC,p.color,Math.pow(e,1.5)),FLASH,flash);
      ctx.save();
      ctx.shadowColor = hex(dim(col,0.7));
      ctx.shadowBlur = 4*e;
      drawText(p,px,py,hex(col));
      ctx.restore();
    }

    for (const s of shimmer) {
      const p = s.p;
      const col = s.active ? mix(p.color, FLASH, 0.6) : p.color;
      drawText(p, p.x, -p.y, hex(col));
    }
  }

  function reset() {
    seed = 11;
    ORDER = build();
    nextIndex = 0;
    active = [];
    finished = [];
    shimmer = [];
    complete = false;
    startTime = performance.now();
    lastTime = startTime;
    shimmerTime = startTime;
    requestAnimationFrame(frame);
  }

  function frame(now) {
    const dt = Math.min(50, now-lastTime);
    lastTime = now;
    if (!complete) {
      const elapsed = now-startTime;
      const desired = Math.min(ORDER.length, Math.floor(elapsed / (DURATION*1000) * ORDER.length));
      while (nextIndex < desired) {
        const p = ORDER[nextIndex++];
        p.frame = 0;
        p.dx = (rand()*20)-10;
        active.push(p);
      }
      active.forEach(p => p.frame += dt/TICK);
      const still = [];
      for (const p of active) {
        if (p.frame >= ANIM) finished.push(p);
        else still.push(p);
      }
      active = still;
      if (elapsed >= DURATION*1000 && nextIndex < ORDER.length) {
        while (nextIndex < ORDER.length) {
          const p = ORDER[nextIndex++];
          p.frame = 0; p.dx = rand()*20-10; active.push(p);
        }
      }
      if (nextIndex >= ORDER.length && active.length === 0) {
        complete = true;
        shimmerTime = now;
      }
    } else if (now-shimmerTime >= 140) {
      shimmerTime = now;
      if (finished.length) {
        const p = choice(finished);
        shimmer = [{p, active:true}];
        setTimeout(() => { shimmer = [{p, active:false}]; draw(); }, 260);
      }
    }
    draw();
    requestAnimationFrame(frame);
  }

  window.addEventListener("resize", resize);
  resize();
  reset();
})();
</script>
</body>
</html>
